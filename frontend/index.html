<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VeggieSense AI</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- HEIC Converter -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <div class="header-icon">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <div>
                <h2>VeggieSense AI</h2>
                <p>AI Vegetable & Crop Assistant</p>
            </div>
        </div>


        <!-- Chat Area -->
        <div class="chat-box" id="chatBox">

            <!-- Initial Bot Message -->
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>

                <div class="message-content">
                    Hello! 👋<br><br>
                    Upload a vegetable or crop image and I will analyze it for you.
                </div>
            </div>

        </div>


        <!-- Image Preview -->
        <div class="preview-container" id="previewContainer">

            <div class="preview-image-wrapper">

                <img id="previewImage" src="" alt="Selected image">

                <button class="remove-preview" id="removePreview" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

        </div>


        <!-- Input Area -->
        <div class="chat-input-container">

            <!-- Gallery Button -->
            <button class="icon-btn" id="galleryBtn" type="button"
                title="Upload Image">

                <i class="fa-solid fa-image"></i>

            </button>

            <!-- Camera Button -->
            <button class="icon-btn" id="cameraBtn" type="button"
                title="Open Camera">

                <i class="fa-solid fa-camera"></i>

            </button>

            <!-- Hidden Gallery Input -->
            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <!-- Text Input -->
            <input
                type="text"
                id="messageInput"
                placeholder="Ask something about your crop..."
                autocomplete="off"
            >

            <!-- Send Button -->
            <button class="send-btn" id="sendBtn" type="button"
                title="Send">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>


    <!-- ============================= -->
    <!-- CAMERA MODAL -->
    <!-- ============================= -->

    <div class="camera-modal" id="cameraModal">

        <div class="camera-box">

            <!-- Camera Header -->
            <div class="camera-header">

                <h3>
                    <i class="fa-solid fa-camera"></i>
                    Camera
                </h3>

                <button
                    class="camera-close"
                    id="cameraClose"
                    type="button"
                    title="Close Camera">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <!-- Webcam -->
            <div class="camera-preview">

                <video
                    id="cameraVideo"
                    autoplay
                    playsinline>
                </video>

                <!-- Captured Image -->
                <canvas
                    id="cameraCanvas"
                    hidden>
                </canvas>

            </div>


            <!-- Camera Controls -->
            <div class="camera-controls">

                <!-- Take Photo -->
                <button
                    class="take-photo-btn"
                    id="takePhotoBtn"
                    type="button">

                    <i class="fa-solid fa-camera"></i>
                    Take Photo

                </button>


                <!-- Retake -->
                <button
                    class="retake-btn"
                    id="retakeBtn"
                    type="button">

                    <i class="fa-solid fa-rotate-right"></i>
                    Retake

                </button>


                <!-- Use Photo -->
                <button
                    class="use-photo-btn"
                    id="usePhotoBtn"
                    type="button">

                    <i class="fa-solid fa-check"></i>
                    Use Photo

                </button>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
